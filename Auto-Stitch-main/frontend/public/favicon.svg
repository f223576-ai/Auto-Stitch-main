<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5DF9E"/>
      <stop offset="45%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#997A15"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Round Container -->
  <rect width="100" height="100" rx="22" fill="#000000"/>

  <!-- Iconic Auto Stitch Monogram & Needle Emblem -->
  <g transform="translate(4, 2)" filter="url(#glow)">
    <!-- Script 'A' -->
    <path
      d="M26 68 C 22 58, 32 25, 48 18 C 55 15, 62 21, 58 35 C 55 48, 42 62, 28 60"
      stroke="url(#gold)"
      stroke-width="5"
      stroke-linecap="round"
      fill="none"
    />

    <!-- Script 'S' -->
    <path
      d="M48 38 C 58 24, 76 24, 76 42 C 76 56, 48 56, 48 70 C 48 84, 80 84, 84 66"
      stroke="url(#gold)"
      stroke-width="5"
      stroke-linecap="round"
      fill="none"
    />

    <!-- Bespoke Tailoring Needle -->
    <path
      d="M68 14 L 60 84"
      stroke="#ffffff"
      stroke-width="3"
      stroke-linecap="round"
    />
    <!-- Needle Eye -->
    <circle cx="68" cy="16" r="2.5" stroke="#ffffff" stroke-width="1.8" fill="#000000" />
  </g>
</svg>